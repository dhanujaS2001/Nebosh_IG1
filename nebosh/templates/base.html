<!DOCTYPE html>
<html>

<head>

    <title>NEBOSH</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

{% comment %} <nav class="navbar navbar-dark bg-dark">

    <div class="container-fluid">

        <span class="navbar-brand">

            Document Management System

        </span>
       
         <div class="d-flex align-items-center gap-2">

            <a class="nav-link text-light {% if request.resolver_match.url_name == 'dashboard' %}fw-bold text-decoration-underline{% endif %}"
               href="{% url 'dashboard' %}">
                Dashboard
            </a>

            <a class="nav-link text-light {% if request.resolver_match.url_name == 'approve_dashboard' %}fw-bold text-decoration-underline{% endif %}"
               href="#">
                Approved Files
            </a>


            <a class="btn btn-outline-light" href="#">Logout</a>

        </div>


    </div>

</nav> {% endcomment %}
{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
{% endif %}

{% block content %}

{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

</body>

</html>
